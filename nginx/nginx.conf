server {
    listen 80;
    listen [::]:80;
    
    # Thay thế yourdomain.com bằng domain thực tế khi cấu hình trên server hoặc dùng biến môi trường nếu có template Nginx
    # Tạm thời cấu hình đón mọi request HTTP
    server_name _;

    # Block cho Let's Encrypt (Certbot) challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Chuyển hướng toàn bộ HTTP sang HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    
    # Thay thế bằng domain thực tế
    server_name _;

    # Chứng chỉ SSL từ Let's Encrypt
    # Lưu ý: Cần chạy dummy cert hoặc chạy certbot standalone lần đầu trước khi nginx hoạt động với đường dẫn này
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    
    # Cấu hình SSL tối ưu
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Cho phép upload file lớn (VD: Excel)
    client_max_body_size 50M;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        
        # Hỗ trợ WebSocket
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Chuyển tiếp các header từ client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_cache_bypass $http_upgrade;
    }
}
