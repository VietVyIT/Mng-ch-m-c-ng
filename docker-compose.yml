# ============================================================
# ATTENDLY – Docker Compose (Development & Production)
# ============================================================
# Khởi chạy:  docker compose up -d --build
# Dừng:       docker compose down
# Xoá data:   docker compose down -v
# ============================================================

services:
  # ── MySQL 8.0 Database ────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: attendly-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-attendance_system}
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Tự động chạy schema khi container khởi tạo lần đầu
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - attendly-network

  # ── Node.js Web Application ──────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendly-app
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      CLIENT_URL: ${CLIENT_URL:-}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-attendance_system}
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-thay-doi-secret-nay-trong-production-toi-thieu-32-ky-tu}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.6}
    networks:
      - attendly-network

# ── Named Volumes ──────────────────────────────────────────
volumes:
  mysql_data:
    driver: local

# ── Internal Network ───────────────────────────────────────
networks:
  attendly-network:
    driver: bridge
