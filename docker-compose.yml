version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: attendly_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-Phanvietvy107@}
      MYSQL_DATABASE: attendance_system
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Tự động thực thi seed.sql khi khởi tạo container lần đầu
      - ./database/seed.sql:/docker-entrypoint-initdb.d/01_init_data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attendly_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-Phanvietvy107@}
      - DB_NAME=attendance_system
      - JWT_SECRET=${JWT_SECRET:-random-secret-for-production-123}
      - CLIENT_URL=http://localhost
    ports:
      - "5000:5000"

  nginx:
    image: nginx:alpine
    container_name: attendly_nginx
    restart: always
    ports:
      - "3000:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app

volumes:
  mysql_data:
